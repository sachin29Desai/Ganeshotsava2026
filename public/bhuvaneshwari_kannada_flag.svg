<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Karnataka Bicolor Gradient -->
    <linearGradient id="karnatakaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="karnatakaYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="divineGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Shield Border -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#divineGold)" stroke-width="6"/>

  <!-- Background Karnataka Flag Shield split horizontally: Top Red, Bottom Yellow -->
  <g clip-path="url(#circleClip)">
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="91"/>
    </clipPath>
    <!-- Top Half Red -->
    <rect x="0" y="0" width="200" height="100" fill="url(#karnatakaRed)"/>
    <!-- Bottom Half Yellow -->
    <rect x="0" y="100" width="200" height="100" fill="url(#karnatakaYellow)"/>
    <!-- Subtle Flag Divider Line -->
    <line x1="0" y1="100" x2="200" y2="100" stroke="#FBBF24" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Divine Halo behind Goddess Bhuvaneshwari -->
  <circle cx="100" cy="85" r="55" fill="url(#haloGlow)"/>
  
  <!-- Rays of Light -->
  <g stroke="url(#divineGold)" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="100" y1="20" x2="100" y2="10"/>
    <line x1="145" y1="40" x2="152" y2="33"/>
    <line x1="165" y1="85" x2="175" y2="85"/>
    <line x1="55" y1="40" x2="48" y2="33"/>
    <line x1="35" y1="85" x2="25" y2="85"/>
    <line x1="135" y1="28" x2="141" y2="20"/>
    <line x1="65" y1="28" x2="59" y2="20"/>
  </g>

  <!-- Goddess Bhuvaneshwari Devi Stylized Iconography -->
  <!-- Crown (Kirita Mukuta) -->
  <path d="M78 58 L100 20 L122 58 L112 58 L100 32 L88 58 Z" fill="url(#divineGold)" stroke="#78350F" stroke-width="1.5"/>
  <circle cx="100" cy="20" r="5" fill="#EF4444"/>
  <circle cx="100" cy="40" r="4" fill="#10B981"/>
  <circle cx="88" cy="50" r="3" fill="#EF4444"/>
  <circle cx="112" cy="50" r="3" fill="#EF4444"/>

  <!-- Face Contour & Tilaka -->
  <ellipse cx="100" cy="74" rx="18" ry="20" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <!-- Kumkuma & Arishina Tilaka on Forehead -->
  <path d="M97 64 Q100 60 103 64 Q100 70 97 64 Z" fill="#DC2626"/>
  <circle cx="100" cy="62" r="2" fill="#FBBF24"/>

  <!-- Eyes (Divine Lotus Eyes) -->
  <path d="M88 72 Q93 69 97 73 Q93 75 88 72 Z" fill="#1C1917"/>
  <path d="M103 73 Q107 69 112 72 Q107 75 103 73 Z" fill="#1C1917"/>
  
  <!-- Nose Ring & Gentle Smile -->
  <path d="M96 82 Q100 85 104 82" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="94" cy="80" r="1.5" fill="#DC2626"/>

  <!-- Golden Saree & Garlands -->
  <path d="M70 100 Q100 90 130 100 L140 150 Q100 165 60 150 Z" fill="#B91C1C" stroke="#FEF08A" stroke-width="2"/>
  <path d="M80 100 Q100 115 120 100 Q110 135 100 145 Q90 135 80 100 Z" fill="url(#divineGold)"/>

  <!-- Abhaya Hasta (Blessing Hand) -->
  <g transform="translate(125, 95)">
    <path d="M0 15 C5 5, 12 5, 15 15 C17 22, 10 30, 0 28 Z" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
    <circle cx="8" cy="18" r="3" fill="#DC2626"/> <!-- Red Kumkuma on palm -->
  </g>

  <!-- Miniature Karnataka Bicolor Flag in Left Hand -->
  <g transform="translate(45, 90)">
    <!-- Flag Pole -->
    <line x1="15" y1="0" x2="15" y2="60" stroke="url(#divineGold)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="15" cy="0" r="3" fill="#F59E0B"/>
    <!-- Flag Waving -->
    <path d="M15 5 Q30 0 42 7 L42 27 Q30 20 15 25 Z" fill="#DC2626" stroke="#991B1B" stroke-width="1"/>
    <path d="M15 25 Q30 20 42 27 L42 47 Q30 40 15 45 Z" fill="#FBBF24" stroke="#D97706" stroke-width="1"/>
  </g>

  <!-- Kannada Script Banner at Bottom: ಶ್ರೀ ಭುವನೇಶ್ವರಿ ದೇವಿ -->
  <rect x="25" y="152" width="150" height="26" rx="13" fill="#1C1917" stroke="url(#divineGold)" stroke-width="2"/>
  <text x="100" y="169" font-family="'Tiro Kannada', 'Noto Sans Kannada', serif" font-weight="900" font-size="12" fill="#FDE047" text-anchor="middle">
    ಶ್ರೀ ಭುವನೇಶ್ವರಿ ದೇವಿ
  </text>
</svg>
