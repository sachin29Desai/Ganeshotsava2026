<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Soft Aura Glow -->
    <radialGradient id="divineAura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#FDE047" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Halo Radiance -->
    <radialGradient id="haloSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE68A" />
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>

    <!-- Divine Ganesha Skin (Soft Serene Cyan) -->
    <linearGradient id="ganeshaSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="40%" stop-color="#7DD3FC" />
      <stop offset="80%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="ganeshaSkinLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="60%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <!-- Royal Gold for Crown & Jewels -->
    <linearGradient id="richGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#FBBF24" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Saffron Dhoti -->
    <linearGradient id="dhotiOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="30%" stop-color="#FB923C" />
      <stop offset="70%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>

    <!-- Sacred Lotus Petal -->
    <g id="auraPetal">
      <path d="M 0,0 C -5,-12 -6,-24 0,-34 C 6,-24 5,-12 0,0 Z" fill="#FBBF24" opacity="0.75" />
    </g>
  </defs>

  <!-- 1. Circular Outer Protective Glow -->
  <circle cx="250" cy="250" r="236" fill="url(#divineAura)" />

  <!-- 2. Sacred Circular Prabhavali / Mandorla (Intricate Aura Rays) -->
  <g transform="translate(250, 180)">
    <circle cx="0" cy="0" r="145" fill="url(#haloSun)" opacity="0.25" />
    <circle cx="0" cy="0" r="135" fill="none" stroke="#F59E0B" stroke-width="2.5" opacity="0.6" stroke-dasharray="4,4" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.7" />
    <circle cx="0" cy="0" r="105" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.5" stroke-dasharray="3,3" />

    <!-- Radiating Lotus Halo Rays (36 petals) -->
    <g opacity="0.65">
      <use href="#auraPetal" transform="rotate(0) translate(0, -115)" />
      <use href="#auraPetal" transform="rotate(20) translate(0, -115)" />
      <use href="#auraPetal" transform="rotate(40) translate(0, -115)" />
      <use href="#auraPetal" transform="rotate(60) translate(0, -115)" />
      <use href="#auraPetal" transform="rotate(80) translate(0, -115)" />
      <use href="#auraPetal" transform="rotate(100) translate(0, -115)" />
      <use href="#auraPetal" transform="rotate(120) translate(0, -115)" />
      <use href="#auraPetal" transform="rotate(140) translate(0, -115)" />
      <use href="#auraPetal" transform="rotate(160) translate(0, -115)" />
      <use href="#auraPetal" transform="rotate(180) translate(0, -115)" />
      <use href="#auraPetal" transform="rotate(200) translate(0, -115)" />
      <use href="#auraPetal" transform="rotate(220) translate(0, -115)" />
      <use href="#auraPetal" transform="rotate(240) translate(0, -115)" />
      <use href="#auraPetal" transform="rotate(260) translate(0, -115)" />
      <use href="#auraPetal" transform="rotate(280) translate(0, -115)" />
      <use href="#auraPetal" transform="rotate(300) translate(0, -115)" />
      <use href="#auraPetal" transform="rotate(320) translate(0, -115)" />
      <use href="#auraPetal" transform="rotate(340) translate(0, -115)" />
    </g>
  </g>

  <!-- 3. LORD GANESHA FIGURE - Centered at (250, 275) with Scale 1.25 -->
  <g id="lord_ganesha" transform="translate(250, 275) scale(1.22)">

    <!-- Upper Left Arm (Lotus) -->
    <g id="upper_left_arm">
      <path d="M 42,-55 C 65,-75 95,-70 102,-40 C 105,-25 95,-15 80,-20" fill="url(#ganeshaSkin)" stroke="#0369A1" stroke-width="1.8" />
      <path d="M 65,-65 C 75,-60 85,-65 88,-55" stroke="url(#richGold)" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M 94,-35 C 98,-30 102,-35 100,-25" stroke="url(#richGold)" stroke-width="3.5" stroke-linecap="round" fill="none" />
      <!-- Divine Pink Lotus Flower -->
      <g transform="translate(105, -50)">
        <path d="M 0,0 C -14,-16 -6,-32 0,-36 C 6,-32 14,-16 0,0 Z" fill="#F472B6" stroke="#BE185D" stroke-width="1.2" />
        <path d="M -7,-6 C -20,-17 -16,-28 -8,-30 C -2,-22 0,-11 -7,-6 Z" fill="#FBCFE8" />
        <path d="M 7,-6 C 20,-17 16,-28 8,-30 C 2,-22 0,-11 7,-6 Z" fill="#FBCFE8" />
      </g>
    </g>

    <!-- Upper Right Arm (Divine Ankusha / Parashu) -->
    <g id="upper_right_arm">
      <path d="M -42,-55 C -65,-75 -95,-70 -102,-40 C -105,-25 -95,-15 -80,-20" fill="url(#ganeshaSkin)" stroke="#0369A1" stroke-width="1.8" />
      <path d="M -65,-65 C -75,-60 -85,-65 -88,-55" stroke="url(#richGold)" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M -94,-35 C -98,-30 -102,-35 -100,-25" stroke="url(#richGold)" stroke-width="3.5" stroke-linecap="round" fill="none" />
      <!-- Golden Goad / Ankusha -->
      <g transform="translate(-105, -45) rotate(-20)">
        <line x1="0" y1="-32" x2="0" y2="38" stroke="url(#richGold)" stroke-width="4" stroke-linecap="round" />
        <path d="M 0,-15 C -16,-22 -22,-6 -6,0 Z" fill="url(#richGold)" stroke="#92400E" stroke-width="1.2" />
        <circle cx="0" cy="-32" r="4.5" fill="#DC2626" />
      </g>
    </g>

    <!-- Large Ears -->
    <!-- Left Ear -->
    <g id="left_ear">
      <path d="M 38,-135 C 75,-165 110,-130 115,-85 C 120,-45 90,-25 45,-45 Z" fill="url(#ganeshaSkin)" stroke="#0284C7" stroke-width="2.2" />
      <path d="M 50,-125 C 80,-145 100,-120 102,-85 C 104,-55 85,-45 55,-60 Z" fill="#FED7AA" opacity="0.65" />
      <circle cx="85" cy="-40" r="9" fill="url(#richGold)" stroke="#B45309" stroke-width="1.5" />
      <circle cx="85" cy="-40" r="3.5" fill="#DC2626" />
    </g>
    <!-- Right Ear -->
    <g id="right_ear">
      <path d="M -38,-135 C -75,-165 -110,-130 -115,-85 C -120,-45 -90,-25 -45,-45 Z" fill="url(#ganeshaSkin)" stroke="#0284C7" stroke-width="2.2" />
      <path d="M -50,-125 C -80,-145 -100,-120 -102,-85 C -104,-55 -85,-45 -55,-60 Z" fill="#FED7AA" opacity="0.65" />
      <circle cx="-85" cy="-40" r="9" fill="url(#richGold)" stroke="#B45309" stroke-width="1.5" />
      <circle cx="-85" cy="-40" r="3.5" fill="#DC2626" />
    </g>

    <!-- Seated Legs & Saffron Dhoti -->
    <g id="dhoti_and_legs">
      <path d="M -95,65 C -115,50 -105,15 -60,20 C -20,22 -10,35 0,35 C 10,35 20,22 60,20 C 105,15 115,50 95,65 C 65,85 -65,85 -95,65 Z" fill="url(#dhotiOrange)" stroke="#9A3412" stroke-width="2.2" />
      <!-- Dhoti Pleats -->
      <path d="M -45,30 C -30,65 -20,80 -25,95" stroke="#7C2D12" stroke-width="2.5" fill="none" />
      <path d="M 0,35 C 0,70 -5,85 0,100" stroke="#7C2D12" stroke-width="2.5" fill="none" />
      <path d="M 45,30 C 30,65 20,80 25,95" stroke="#7C2D12" stroke-width="2.5" fill="none" />
      <!-- Golden Border Zari -->
      <path d="M -85,68 C -45,85 45,85 85,68" stroke="url(#richGold)" stroke-width="4.5" fill="none" stroke-linecap="round" />
      <!-- Feet -->
      <ellipse cx="-75" cy="72" rx="16" ry="10" fill="url(#ganeshaSkinLight)" stroke="#0284C7" stroke-width="1.5" />
      <ellipse cx="75" cy="72" rx="16" ry="10" fill="url(#ganeshaSkinLight)" stroke="#0284C7" stroke-width="1.5" />
      <path d="M -86,68 C -75,72 -65,70 -64,66" stroke="url(#richGold)" stroke-width="3" fill="none" />
      <path d="M 64,66 C 65,70 75,72 86,68" stroke="url(#richGold)" stroke-width="3" fill="none" />
    </g>

    <!-- Torso & Ornaments -->
    <g id="torso">
      <path d="M -48,-35 C -65,5 -55,42 0,45 C 55,42 65,5 48,-35 Z" fill="url(#ganeshaSkin)" stroke="#0284C7" stroke-width="2" />
      <ellipse cx="0" cy="26" rx="4" ry="2.5" fill="#0369A1" opacity="0.6" />
      <!-- Sacred Janeu Thread -->
      <path d="M -32,-30 C -15,-5 5,18 28,38" stroke="url(#richGold)" stroke-width="2.8" fill="none" stroke-linecap="round" />
      <!-- Golden Necklaces -->
      <path d="M -30,-32 C -18,-15 18,-15 30,-32" stroke="url(#richGold)" stroke-width="4.5" fill="none" />
      <circle cx="0" cy="-20" r="7" fill="#DC2626" stroke="url(#richGold)" stroke-width="2.2" />
      <circle cx="0" cy="-20" r="3" fill="#FEF08A" />
    </g>

    <!-- Lower Right Hand (Abhaya Mudra - Blessing) -->
    <g id="front_right_hand">
      <path d="M -45,-15 C -65,-5 -75,5 -65,22 C -55,30 -42,20 -38,5" fill="url(#ganeshaSkinLight)" stroke="#0284C7" stroke-width="1.8" />
      <ellipse cx="-60" cy="10" rx="15" ry="17" fill="url(#ganeshaSkinLight)" stroke="#0284C7" stroke-width="1.8" />
      <circle cx="-60" cy="10" r="5" fill="#EF4444" opacity="0.9" />
      <path d="M -60,5 L -60,15 M -65,10 L -55,10" stroke="#FEF08A" stroke-width="1.8" />
      <path d="M -48,-2 C -42,3 -45,10 -52,6" stroke="url(#richGold)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Lower Left Hand (Modak Bowl) -->
    <g id="front_left_hand">
      <path d="M 45,-15 C 65,-5 75,5 65,22 C 55,30 42,20 38,5" fill="url(#ganeshaSkinLight)" stroke="#0284C7" stroke-width="1.8" />
      <ellipse cx="55" cy="14" rx="16" ry="13" fill="url(#ganeshaSkinLight)" stroke="#0284C7" stroke-width="1.8" />
      <!-- Golden Modak Bowl -->
      <path d="M 42,12 C 42,23 70,23 70,12 Z" fill="url(#richGold)" stroke="#B45309" stroke-width="1.8" />
      <!-- Golden Modak -->
      <path d="M 51,12 C 49,5 56,-2 56,-4 C 56,-2 63,5 61,12 Z" fill="#FBBF24" stroke="#D97706" stroke-width="1.8" />
      <circle cx="56" cy="-4" r="2.5" fill="#EF4444" />
      <path d="M 48,-2 C 42,3 45,10 52,6" stroke="url(#richGold)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Head, Trunk & Tusks -->
    <g id="head_and_trunk">
      <path d="M -40,-130 C -55,-100 -50,-50 -20,-45 C -15,-40 -10,-35 0,-35 C 10,-35 15,-40 20,-45 C 50,-50 55,-100 40,-130 Z" fill="url(#ganeshaSkin)" stroke="#0284C7" stroke-width="2.2" />
      <ellipse cx="-32" cy="-65" rx="17" ry="15" fill="#BAE6FD" opacity="0.5" />
      <ellipse cx="32" cy="-65" rx="17" ry="15" fill="#BAE6FD" opacity="0.5" />

      <!-- Full Left Tusk -->
      <path d="M 18,-52 C 28,-50 34,-45 32,-38 C 30,-36 24,-45 16,-48 Z" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2" />
      <path d="M 21,-50 L 23,-45" stroke="url(#richGold)" stroke-width="1.8" />
      <!-- Broken Right Tusk (Ekadanta) -->
      <path d="M -18,-52 C -24,-50 -28,-46 -26,-42 C -24,-40 -20,-46 -16,-48 Z" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2" />

      <!-- Curved Trunk towards Modak -->
      <path d="M -14,-50 C -12,-25 -8,0 5,12 C 18,24 35,22 45,15 C 52,8 52,-2 46,-4 C 40,-6 38,4 30,5 C 22,6 12,-2 6,-18 C 0,-32 4,-45 14,-50 Z" fill="url(#ganeshaSkin)" stroke="#0284C7" stroke-width="2.2" />
      <!-- Trunk Grooves -->
      <path d="M -5,-30 C 0,-28 5,-30 6,-32" stroke="#0369A1" stroke-width="1.8" fill="none" opacity="0.75" />
      <path d="M -2,-15 C 3,-13 8,-15 10,-18" stroke="#0369A1" stroke-width="1.8" fill="none" opacity="0.75" />
      <path d="M 4,0 C 9,2 14,0 16,-3" stroke="#0369A1" stroke-width="1.8" fill="none" opacity="0.75" />
      <path d="M 15,10 C 20,12 25,9 26,6" stroke="#0369A1" stroke-width="1.8" fill="none" opacity="0.75" />
      <!-- Gold Bell on Trunk Tip -->
      <circle cx="48" cy="-1" r="4" fill="url(#richGold)" stroke="#92400E" stroke-width="1.2" />

      <!-- Divine Eyes -->
      <g transform="translate(-24, -85)">
        <path d="M -13,0 C -5,-8 5,-8 13,0 C 5,7 -5,7 -13,0 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8" />
        <ellipse cx="0" cy="0" rx="4.8" ry="5.2" fill="#1E293B" />
        <circle cx="0" cy="0" r="2.6" fill="#000000" />
        <circle cx="-1.6" cy="-1.6" r="1.3" fill="#FFFFFF" />
        <path d="M -15,-6 C -6,-13 4,-13 13,-6" stroke="#0369A1" stroke-width="2.2" fill="none" stroke-linecap="round" />
      </g>
      <g transform="translate(24, -85)">
        <path d="M -13,0 C -5,-8 5,-8 13,0 C 5,7 -5,7 -13,0 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8" />
        <ellipse cx="0" cy="0" rx="4.8" ry="5.2" fill="#1E293B" />
        <circle cx="0" cy="0" r="2.6" fill="#000000" />
        <circle cx="-1.6" cy="-1.6" r="1.3" fill="#FFFFFF" />
        <path d="M -13,-6 C -4,-13 6,-13 15,-6" stroke="#0369A1" stroke-width="2.2" fill="none" stroke-linecap="round" />
      </g>

      <!-- Sacred Forehead Tilak (Trishul & Red Kumkum) -->
      <g transform="translate(0, -90)">
        <path d="M -13,-16 C -8,-8 0,-5 0,0 C 0,-5 8,-8 13,-16 C 6,-10 0,-10 -13,-16 Z" fill="#FDE047" stroke="#CA8A04" stroke-width="1.2" />
        <path d="M 0,-25 L 0,0" stroke="#DC2626" stroke-width="3.2" stroke-linecap="round" />
        <circle cx="0" cy="-2" r="3" fill="#DC2626" />
      </g>
    </g>

    <!-- Royal Golden Crown (Mukut) -->
    <g id="royal_mukut" transform="translate(0, -125)">
      <path d="M -40,0 C -19,7 19,7 40,0 C 37,-13 -37,-13 -40,0 Z" fill="url(#crownGold)" stroke="#78350F" stroke-width="1.8" />
      <circle cx="-26" cy="-3" r="3.5" fill="#EF4444" />
      <circle cx="-13" cy="-2" r="3.5" fill="#10B981" />
      <circle cx="0" cy="-1" r="4" fill="#EF4444" />
      <circle cx="13" cy="-2" r="3.5" fill="#10B981" />
      <circle cx="26" cy="-3" r="3.5" fill="#EF4444" />

      <!-- Crown Middle Tier -->
      <path d="M -35,-10 C -22,-30 0,-32 0,-32 C 0,-32 22,-30 35,-10 C 23,-19 -23,-19 -35,-10 Z" fill="url(#richGold)" stroke="#78350F" stroke-width="1.8" />
      <path d="M 0,-36 C -11,-25 0,-14 0,-14 C 0,-14 11,-25 0,-36 Z" fill="#DC2626" stroke="url(#crownGold)" stroke-width="2.2" />
      <circle cx="0" cy="-25" r="3" fill="#FEF08A" />

      <!-- Pinnacle Kalasha Spire -->
      <path d="M -21,-27 C -13,-58 0,-68 0,-68 C 0,-68 13,-58 21,-27 Z" fill="url(#crownGold)" stroke="#78350F" stroke-width="1.8" />
      <circle cx="0" cy="-46" r="4.5" fill="#EF4444" stroke="url(#richGold)" stroke-width="1.2" />
      <path d="M 0,-68 L -4.5,-80 L 0,-89 L 4.5,-80 Z" fill="url(#richGold)" stroke="#92400E" stroke-width="1.2" />
      <circle cx="0" cy="-89" r="3.5" fill="#EF4444" />
    </g>

  </g>
</svg>
